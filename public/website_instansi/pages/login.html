<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - SIBAPER</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body>


<main class="login-page">


    <div class="login-card">


        <!-- =====================================================
             HEADER
        ====================================================== -->

        <div class="login-header">

            <div class="login-logo">
                DISHUB
            </div>

            <div class="login-system-name">
                SIBAPER
            </div>

            <h1>
                Selamat Datang
            </h1>

            <p>
                Sistem Informasi Bidang Pelayaran
            </p>

        </div>



        <!-- =====================================================
             LOGIN FORM
        ====================================================== -->

        <form id="loginForm">


            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Masukkan username"
                    autocomplete="username"
                    required
                >

            </div>



            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Masukkan email"
                    autocomplete="email"
                    required
                >

            </div>



            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Masukkan password"
                    autocomplete="current-password"
                    required
                >

            </div>



            <div
                id="loginMessage"
                class="login-message"
            ></div>



            <button
                type="submit"
                class="btn-login"
            >
                Masuk ke Sistem
            </button>


        </form>



        <!-- =====================================================
             REGISTER
        ====================================================== -->

        <div class="register-section">


            <p>
                Belum memiliki akun?
            </p>


            <button
                type="button"
                class="btn-register"
                id="registerUserButton"
            >
                Registrasi User
            </button>


        </div>


    </div>


</main>



<script src="../js/login.js"></script>


</body>

</html>
