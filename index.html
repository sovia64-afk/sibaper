<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIBAPER - Sistem Informasi Bidang Pelayaran</title>
    <meta name="description" content="SIBAPER - Sistem Informasi Bidang Pelayaran">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script>
        (async function() {
            if (window.sibaperReady) await window.sibaperReady;
            var session = localStorage.getItem("sibaperSession");
            if (session) window.location.replace("pages/dashboard.html");
            else window.location.replace("pages/login.html");
        })();
    </script>
</head>
<body>
    <div style="padding: 40px; text-align: center; font-family: sans-serif;">
        <h2>Mengarahkan ke SIBAPER...</h2>
        <p><a href="pages/dashboard.html">Klik di sini jika tidak diarahkan otomatis</a></p>
    </div>
</body>
</html>
